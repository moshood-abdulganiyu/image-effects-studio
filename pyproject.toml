[project]
name = "image-effects-studio"
version = "0.1.0"
description = "Upload an image, apply cartoonify, grayscale, pencil sketch, oil painting, or pixel art effects on demand."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "opencv-contrib-python>=4.10.0.84",
    "numpy>=1.26.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.0",
    "matplotlib>=3.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
